name: Build installer

# Builds the Windows installer on GitHub's own Windows machine. Run it by hand (Actions > Build
# installer > Run workflow) for a downloadable artifact; tick "release", or push a vX.Y.Z tag, to release it:
# the installer is then signed and published as the latest release, which every Altbase with
# "Check for Altbase updates" on finds within the hour and installs.
#
# Hardening: every action is pinned to a full commit hash (a moved tag can't change what runs).
# The build job reads the repo and holds no secrets. Only the small `sign` job sees the
# ALTBASE_UPDATE_KEY secret, after the build, and it runs no third-party code but the pinned
# artifact actions: it signs "Altbase-Setup-<version>.exe\n" + the installer's bytes (ECDSA P-256,
# IEEE P1363, base64), checks that against PUBLIC_KEY in src-tauri/src/self_update.rs, and only
# then hands the pair to `release`.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release:
        description: "Publish it: tag v<version> (from tauri.conf.json), sign it and release it to everyone"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - id: v
        run: |
          $version = (Get-Content -Raw src-tauri\tauri.conf.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            echo "::error::tag $env:GITHUB_REF_NAME is not v$version, the version in src-tauri/tauri.conf.json"
            exit 1
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      # A release installs itself on every PC within the hour, so it must pass the tests first.
      - name: Tests must pass before a release
        if: github.ref_type == 'tag' || inputs.release
        run: |
          npm ci
          npm run build
          cd src-tauri
          cargo test --locked
      - name: Inno Setup 6.6+
        run: choco upgrade innosetup --no-progress -y
      - run: powershell -ExecutionPolicy Bypass -File scripts\build-installer.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Altbase-Setup-${{ steps.v.outputs.version }}
          path: dist-installer/Altbase-Setup-${{ steps.v.outputs.version }}.exe
          if-no-files-found: error

  sign:
    # For a pushed v* tag, or a manual run with "release" ticked.
    if: github.ref_type == 'tag' || inputs.release
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: src-tauri/src/self_update.rs
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: Altbase-Setup-${{ needs.windows.outputs.version }}
          path: dist
      - name: Sign the installer for the self-updater
        env:
          ALTBASE_UPDATE_KEY: ${{ secrets.ALTBASE_UPDATE_KEY }}
          VERSION: ${{ needs.windows.outputs.version }}
        run: |
          node -e '
            const crypto = require("crypto"), fs = require("fs");
            const key = process.env.ALTBASE_UPDATE_KEY;
            if (!key) { console.log("::error::the ALTBASE_UPDATE_KEY secret is not set: the installer cannot be signed"); process.exit(1); }
            const name = `Altbase-Setup-${process.env.VERSION}.exe`, exe = `dist/${name}`;
            const data = Buffer.concat([Buffer.from(name + "\n"), fs.readFileSync(exe)]);
            const sig = crypto.sign("sha256", data, { key, dsaEncoding: "ieee-p1363" });
            const hex = fs.readFileSync("src-tauri/src/self_update.rs", "utf8").match(/const PUBLIC_KEY: &str = "([0-9a-f]{128})"/)[1];
            const xy = Buffer.from(hex, "hex"), b64 = (b) => b.toString("base64url");
            const pub = crypto.createPublicKey({ key: { kty: "EC", crv: "P-256", x: b64(xy.subarray(0, 32)), y: b64(xy.subarray(32)) }, format: "jwk" });
            if (!crypto.verify("sha256", data, { key: pub, dsaEncoding: "ieee-p1363" }, sig)) {
              console.log("::error::ALTBASE_UPDATE_KEY is not the key whose public half is PUBLIC_KEY in self_update.rs: Altbase would refuse this installer");
              process.exit(1);
            }
            fs.writeFileSync(exe + ".sig", sig.toString("base64"));
            console.log("signed " + exe);
          '
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: signed
          path: |
            dist/Altbase-Setup-${{ needs.windows.outputs.version }}.exe
            dist/Altbase-Setup-${{ needs.windows.outputs.version }}.exe.sig
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag' || inputs.release
    needs: [windows, sign]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: signed
          path: dist
      - name: Publish the release
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.windows.outputs.tag }}
          VERSION: ${{ needs.windows.outputs.version }}
        run: |
          # The same installer under a fixed name, so releases/latest/download/Altbase-Setup.exe
          # (the README's Download button) always gets the newest. The updater only reads the
          # versioned one and its .sig.
          cp "Altbase-Setup-$VERSION.exe" Altbase-Setup.exe
          sha256sum -- * > SHA256SUMS.txt
          printf 'Download **Altbase-Setup.exe** below and run it (version %s). Already installed? Altbase updates itself, keeping your accounts.\n\nNot code-signed: Windows SmartScreen warns on first run (More info > Run anyway).\n\n~~~\n%s\n~~~\n' "$VERSION" "$(cat SHA256SUMS.txt)" > ../notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" ./* --clobber
          else
            gh release create "$TAG" ./* --target "$GITHUB_SHA" --title "Altbase $VERSION" --notes-file ../notes.md --latest
          fi
